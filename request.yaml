
Reference_prompt: "Создай модель двухзвенного маятника, система состоит из двух абсолютно жестких невесомых стержней длины l1 и l2. l1=5, l2=1.
          Массы грузов 1 кг верхнего груза, 3 кг нижнего груза. Угол отклонения первого звена от вертикали 10 градусов, 
          угол отклонения второго звена от вертикали 15 градусов.
          Начальные скорости и ускорения принять равным 0 в начале симуляции."

rearrangement_structure: "
Создай математическую модель двухзвенного маятника. Маятник состоит из двух абсолютно жестких невесомых стержней. Длина первого стержня l1 составляет 5, длина второго стержня l2 составляет 1. К первому звену прикреплен груз массой 1 кг, ко второму — груз массой 3 кг. Начальное отклонение первого звена относительно вертикали равно 10 градусов, второго звена относительно вертикали — 15 градусов. В начальный момент времени симуляции начальные скорости и ускорения обоих звеньев принять равными нулю.
"

natural_description: "
Необходимо создать модель двухзвенного маятника, состоящего из двух абсолютно жестких стержней без собственной массы. Длина первого звена равна l1=5, а длина второго — l2=1. На концах звеньев расположены грузы: масса верхнего груза составляет 1 кг, масса нижнего — 3 кг. В начальный момент первый стержень отклонен от вертикального положения на 10 градусов, а второй стержень — на 15 градусов. Начальные значения скоростей и ускорений принять равными нулю.
"

differs_in_syntax: "
Смоделируй движение системы из двух последовательно соединенных абсолютно жестких невесомых звеньев. Первое звено имеет длину 5 (l1=5), второе — длину 1 (l2=1). Масса груза, расположенного на первом звене, равна 1 кг; масса груза на втором звене составляет 3 кг. В начальной конфигурации оба звена имеют ненулевое угловое отклонение от вертикали: для первого звена оно составляет 10 градусов, для второго — 15 градусов. При запуске симуляции считать начальные скорости и ускорения равными нулю."

reformulated request: "Сгенерируй модель двухзвенного маятника, где расстояние между маятниками 1 метр, а между маятником и поверхностью 5 метров. Массы маятников 1 кг верхнего маятника, 3 кг нижнего маятника. Начальные вначале симуляции угол между верхним маятником и поверхностью 10 градусов, а между нижним маятников и поверхностью 15 градусов. Начальные скорости и ускорения принять равным 0 в начале симуляции."


