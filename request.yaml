Эталонный запрос: "Создай модель двухзвенного маятника, система состоит из двух абсолютно жестких невесомых стержней длины l1 и l2. l1=5, l2=2. Массы грузов 2 кг верхнего груза, 3 кг нижнего груза. Угол отклонения первого звена от вертикали 10 градусов, угол отклонения второго звена от вертикали 15 градусов. Углы независимые абсолютные, отсчитываемые от вертикали, направленной вниз. Начальные скорости и ускорения принять равным 0 в начале симуляции. Второй угол абсолютный, не относителен. Внутри вычислений использовать радианы и числа двойной точности. Не округлять радианные значения вручную и не применять преобразование pi/2-angle."

Свободное описание: "Необходимо создать модель двухзвенного маятника, состоящего из двух легких палок, соединенных между собой. Длина первой палки равна l1=5, а длина второй - l2=2. На звеньях грузы: масса верхнего груза 2 кг, масса нижнего - 3 кг. В начальный момент первая палка отклонена от вертикального положения на 10 градусов, а вторая - на 15 градусов. Начальные значения скоростей и ускорений принять равными нулю. Второй угол абсолютный. Испольуй радианы и числа двойной точности. Не округлять радианные значения вручную и не применять преобразование pi/2-angle."

