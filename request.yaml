math_description: Создай математическую модель, система состоит из двух абсолютно жестких невесомых стержней длины l1 и l2. l1=5, l2=2. Массы грузов 2 кг верхнего груза, 3 кг нижнего груза. Угол отклонения первого звена от вертикали 10 градусов, угол отклонения второго звена от вертикали 15 градусов. Начальные скорости и ускорения принять равным 0 в начале симуляции. Углы независимые абсолютные, отсчитываемые от вертикали, направленной вниз.

manipulator_description: Имеется механическая система, состоящая из двух последовательно соединённых абсолютно жёстких невесомых стержней, движущихся в одной вертикальной плоскости. Первый стержень длиной l1 = 5 прикреплён одним концом к неподвижной точке на потолке. На свободном конце первого стержня расположен груз массой m1 = 2 кг, к этой же точке шарнирно присоединён второй стержень длиной l2 = 2. На свободном конце второго стержня расположен груз массой m2 = 3 кг. Оба шарнирных соединения допускают свободное вращение без фиксации. В начальный момент первый стержень отклонён от вертикали на 10 градусов, второй стержень отклонён от вертикали на 15 градусов. Углы обоих стержней задаются относительно вертикали. Начальные угловые и линейные скорости грузов принять равными 0. Начальные угловые и линейные ускорения принять равными 0 в момент начала симуляции. Смоделируй последующее свободное движение системы под действием силы тяжести и построй траектории движения обоих грузов.

leg_description: Необходимо смоделировать движение упрощённой механической модели ноги в одной вертикальной плоскости без ограничений на вращение в суставах. Модель состоит из двух последовательно соединённых абсолютно жёстких невесомых сегментов. Первый сегмент, соответствующий бедру, имеет длину l1 = 5 м и одним концом шарнирно закреплён в неподвижной точке, соответствующей тазобедренному суставу. На его свободном конце, в области колена, сосредоточена масса m1 = 2 кг. К коленному суставу шарнирно присоединён второй сегмент, соответствующий голени, длиной l2 = 2 м. На его свободном конце, в области ступни, сосредоточена масса m2 = 3 кг. Оба сегмента могут свободно вращаться в своей плоскости без фиксации и дополнительных ограничений. В начальный момент первый сегмент отклонён от вертикали на 10 градусов, а второй сегмент — на 15 градусов. Оба угла задаются относительно вертикали. Начальные угловые и линейные скорости принять равными 0. Начальные угловые и линейные ускорения также принять равными 0 в момент начала симуляции. Смоделируй последующее свободное движение системы под действием силы тяжести и построй траектории движения коленного сустава и ступни.