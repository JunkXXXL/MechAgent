Эталонный запрос: >
  ## Назначение модели
  
  Модель описывает вертикальную динамику подвески Макферсона с учётом шины, пружины и двутрубного гидравлического амортизатора.
  Она предназначена для расчёта реакции подрессоренной и неподрессоренной масс на дорожное воздействие при заданной скорости движения автомобиля.
  Входными воздействиями модели являются дорожный профиль и скорость движения автомобиля по этому профилю.
  Выходными величинами модели являются вертикальное перемещение подрессоренной массы, скорость подрессоренной массы, вертикальное перемещение неподрессоренной массы и скорость неподрессоренной массы.
  
  ## Кинематика подвески
  
  Подвеска рассматривается как механизм Макферсона, в котором вертикальный ход колеса связан с ходом пружины и ходом амортизатора через кинематические передаточные отношения.
  Кинематическая часть учитывает продольный и поперечный наклон амортизационной стойки.
  При сжатии подвески эти углы изменяются, поэтому передача усилий от пружины и амортизатора к колесу зависит от текущего положения подвески.
  Поворот колеса в модели не рассматривается.
  Стабилизатор поперечной устойчивости в модель не включён.
  
  ## Амортизатор
  
  Амортизатор представлен как двутрубный гидравлический амортизатор.
  Его сила включает гидравлическую составляющую, газовый подпор и трение уплотнителей.
  Гидравлическая составляющая формируется сопротивлением потоку рабочей жидкости через клапанные узлы.
  Поршневой и донный клапаны имеют разные характеристики, поэтому сила амортизатора при сжатии и отбое получается несимметричной.
  Газовый подпор создаёт дополнительную силу, связанную с давлением газа в компенсационном объёме.
  Трение уплотнителей учитывает сухую и вязкую составляющие сопротивления движению штока.
  Гистерезис амортизатора в модели не учитывается.
  
  ## Пружина
  
  Пружина моделируется как линейный упругий элемент в рабочей области хода подвески.
  При большом сжатии сила пружины резко возрастает, что имитирует прогрессивное увеличение жёсткости вблизи предельного сжатия пружины.
  
  ## Шина и контакт с дорогой
  
  Шина колеса моделируется как линейный упруго-демпфирующий элемент между неподрессоренной массой и дорогой.
  Модель контакта между шиной и дорогой должна учитывать огибание рельефа шиной на сложных дорожных профилях.
  Это важно для препятствий со скачком высоты, например ступеньки, где эффективная высота контакта определяется не только точкой под центром колеса, но и геометрией огибания препятствия шиной.
  
