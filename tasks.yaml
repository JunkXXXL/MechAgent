input_task:
  description: >
    {request}
  expected_output: >
    Ответ выведи
  agent: input_classifier

code_building:
  description: >
    Создай физическую симуляцию по описанию задачи. Описание: {}
  agent: code_builder

execute_code:
  description:
    Выполни данный код.
  expected_output: >
    Ответ выведи в формате structured output
    {{
    code: запускаемый код,
    logs: логи выполнения кода,
    code_errors: если код выполнился с ошибкой, напиши сюда весь лог ошибки.
    }}
  agent: Code_executor

diagnosis_error:
  description: >
    Текущий код упал с ошибкой: {}.

    Просмотри код и опиши, что нужно исправить с технической точки зрения для решения ошибки. Код:
    {}
    
    Начини описывать со слов: Текущий код упал с ошибкой...
  expected_output: >
    Explain what the error was and how it was corrected
  

create_insight:
  description: >
    Тебе даны результаты симуляции и структурированное ТЗ к симуляции. Сделай небольшой отчёт описание симуляции.
    Структурированный запрос к симуляции: {}
    Код симуляции: {}
    Результаты симуляции в виде логов: {}
  expected_output: >
    Отчёт в markdown формате
  output_file: output/simulation_report.md
  agent: MechanicalInsight
