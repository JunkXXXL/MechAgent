input_task:
  description: "{request}"
  agent: input_classifier

subsystem_design:
  description: |
    Исходный запрос пользователя:
    {request}

    Спецификация параметров и единиц измерения:
    {specification}

    Опиши физические подсистемы, интерфейсы функций и передаваемые величины в Markdown.
  agent: subsystem_designer

code_building:
  description: |
    Исходный запрос пользователя:
    {request}

    Спецификация:
    {specification}

    Архитектура физических подсистем:
    {architecture}

    Реализуй функции всех подсистем согласно этому контракту.
    {feedback}
  agent: code_builder

model_assembly:
  description: |
    Исходный запрос пользователя:
    {request}

    Спецификация:
    {specification}

    Архитектура физических подсистем:
    {architecture}

    Импорты и функции подсистем, которые будут добавлены перед твоим кодом:
    {subsystems}

    Напиши только код сборки и дополнительные импорты для единой запускаемой программы.
    {feedback}
  agent: model_assembler

diagnosis_error:
  description: |
    Текущий код упал с ошибкой: {}.
    Просмотри полный код и опиши технические исправления для функций подсистем и сборки:
    {}
  agent: Error_diagnosis

create_insight:
  description: |
    Кратко опиши полученную физическую модель и как запустить ее на Python.
    Спецификация модели: {}
    Код симуляции: {}
    Логи исполнения: {}
  expected_output: Краткое описание модели и инструкция запуска в Markdown
  agent: MechanicalInsight
